let actor='幹事A（サンプル）',draft=null,selectedPerson=Number(sessionStorage.getItem('kita-demo-person')||1),editId=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=v=>Number(v).toLocaleString('ja-JP')+'円';
const date=v=>v?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
const label={active:'参加予定',attended:'当日参加確認済',cancel_requested:'欠席変更申請中',cancelled:'欠席・取消済',rejoin_requested:'再参加申請中',pending:'確認待ち',confirmed:'確認済',excluded:'除外済'};
const pill=(s,warn=false)=>'<span class="status '+(warn?'status-warn':'')+'">'+esc(label[s]||s)+'</span>';
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('visible');setTimeout(()=>x.classList.remove('visible'),3500);}
function change(fn){const next=R.clone(state);let result;try{result=fn(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;return result;}catch(err){if(err.name==='QuotaExceededError')throw new Error('この端末の保存容量がいっぱいです。追加した画像を非表示にするか、デモを初期化してください。');throw err;}}
function failed(action,entity,error){try{change(s=>R.audit(s,actor,action,entity,null,null,error.message,'失敗・未確定'));}catch{}toast(error.message);}
function download(name,data,type='text/csv;charset=utf-8'){const b=new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function field(name,title,value='',type='text',required=true,help=''){return '<label class="field">'+esc(title)+(required?'<span class="required">必須</span>':'')+(help?' <small>'+esc(help)+'</small>':'')+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+' maxlength="'+(type==='date'?'10':'200')+'"></label>';}
function select(name,title,items,value){return '<label class="field">'+esc(title)+'<select name="'+name+'">'+items.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label>';}
function title(k,t,p=''){return '<div class="page-title"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>';}
const notice='<div class="notice">操作確認専用です。実際の個人情報・銀行明細・写真は入力しないでください。保存先はこのブラウザーだけで、ほかの閲覧者とは共有されません。</div>';
function frame(body,cls=''){return '<div class="container '+cls+'">'+body+'</div>';}
function classCards(){const c=R.counts(state);return '<div class="classes-grid">'+c.classes.map((n,i)=>'<a class="class-card" href="#/classes/'+(i+1)+'"><span class="label">3年'+(i+1)+'組</span><span class="arrow">↗</span><strong>'+n+'<small>人</small></strong><div class="bar"><span style="width:'+Math.min(100,Math.round(n*100/Number(state.settings.classSize||47)))+'%"></span></div></a>').join('')+'</div>'+(state.people.some(p=>R.active(p)&&p.class===0)?'<p>クラス確認中：'+state.people.filter(p=>R.active(p)&&p.class===0).length+'人（全体の参加人数に含みます）</p>':'');}
function homeDate(date){const m=String(date).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[1]+'年'+Number(m[2])+'月'+Number(m[3])+'日':String(date);}
function eventOverview(s){return `<section class="event-overview" aria-label="開催概要・受付案内"><p class="overview-note">開催日・会費・受付日程は、表示確認用の仮設定です。正式なご案内まで実際の受付・お振込はできません。</p><div class="overview-row"><div class="overview-label">WHEN<span>開催日（仮）</span></div><div class="overview-content"><strong>${esc(s.dateLabel)}</strong><p>開催時刻は決まり次第ご案内します。</p></div></div><div class="overview-row"><div class="overview-label">WHERE<span>会場</span></div><div class="overview-content"><strong>${esc(s.venue)}</strong><p>懐かしい岡崎で、再会のひとときを。</p></div></div><div class="overview-row"><div class="overview-label">PARTICIPATION<span>会費・お申し込み（仮）</span></div><div class="overview-content"><p class="registration-label">申込受付期間</p><div class="registration-period"><span>${esc(homeDate(s.open))}</span><span>〜 ${esc(homeDate(s.registration))}</span></div><p class="participation-fee">会費 <strong>${yen(s.fee)}</strong><small>（仮）</small></p></div></div></section>`;}

function applicationSchedule(s){return '<section class="application-schedule"><div class="eyebrow">APPLICATION GUIDE</div><h2>会費・お申し込みの期限</h2><p>以下は表示確認用の仮設定です。</p><dl class="overview-dates"><div><dt>会費（仮）</dt><dd>'+yen(s.fee)+'</dd></div>'+[['registration','申込期限'],['payment','入金期限'],['change','内容変更期限'],['cancel','キャンセル期限']].map(([key,label])=>'<div><dt>'+label+'</dt><dd>'+esc(homeDate(s[key]))+'</dd></div>').join('')+'</dl>'+bankAccountGuide(s)+'<p class="mini-note">内容変更・欠席の申請はログイン後の「申込確認」から行えます。各期限は幹事の設定により変更される場合があります。</p></section>';}

P/2Q==" alt="岡崎北高等学校の校舎" width="960" height="720"><p class="handwriting">Good to see you again.</p></div><div class="year-tag" aria-label="1987年から2028年へ、また会おう"><span class="badge-years"><span>1987</span><span class="badge-arrow" aria-hidden="true">↓</span><span>2028</span></span><small>MEET AGAIN</small></div><span class="art-note">岡崎北高等学校の校舎</span></div></section>${eventOverview(state.settings)}<section class="section"><div class="section-head"><div><div class="eyebrow">FIND YOUR CLASSMATES</div><h2>みんな、集まってきています。</h2><p>あなたのクラスは何人？懐かしい名前を探してみてください。</p></div><div class="total-badge">全体の参加予定 <b>${c.total}</b>人<span>（架空サンプル）</span></div></div>${classCards()}<p class="section-note">※ 人物・人数はすべて架空です。人数には名前を掲載しない設定の方も含みます。</p></section>`)+`<section class="message-section"><div class="container message-grid"><div class="message-title">Long time,<br>no see.<span>また会える、その日まで。</span></div><div class="message-copy"><div class="eyebrow">A NOTE FOR OUR CLASSMATES</div><h2>「久しぶり！」から、はじめよう。</h2><p>あの教室を出てから、それぞれの道を歩いてきた私たち。<br>大人になった今だからこそ、話せることも、笑えることも。<br>肩書きも近況も、ひとまず置いて。<br>懐かしい友人と、気軽に集まれる時間をつくっていきます。</p><p class="message-sign">1987年卒同窓会 幹事会より <small>（案内文サンプル）</small></p></div></div></section>`+frame(`<section class="section"><div class="section-head"><div><div class="eyebrow">OUR PHOTO ALBUM</div><h2>思い出は、これからも増えていく。</h2><p>当日の写真を、みんなで楽しむアルバムに。</p></div><a href="#/gallery" class="text-link">アルバムをのぞく ↗</a></div><div class="gallery-grid">${albumCards(state.photos.filter(p=>p.published).slice(0,3))}</div><p class="section-note">※ 現在はイラストの見本です。本番の写真は参加者限定で公開する予定です。</p></section><section class="cta-section"><div><div class="eyebrow" style="color:#dfdfb2">SEE YOU IN OKAZAKI</div><h2>会いたい顔が、きっといる。</h2><p>まずは申込の流れを、サンプルで体験してみませんか。</p></div><a href="#/register" class="btn btn-light">参加申込を試す ↗</a></section><section class="section"><div class="section-head"><div><div class="eyebrow">QUESTIONS & ANSWERS</div><h2>気になること、いくつか。</h2></div></div><div class="faq-list"><details><summary>このページで、本当に参加申込できますか？</summary><p>今はデザインと操作を確認するためのサンプルです。実際の申込・メール送信・振込は行いません。架空の内容でお試しください。</p></details><details><summary>名前や住所は、みんなに見えますか？</summary><p>名簿には掲載を選んだ表示名だけを出す構成です。本番では住所・電話・メール・入金情報は幹事だけが確認します。今はすべて架空のデータで、幹事画面も自由に体験できます。</p></details><details><summary>申込後に変更や欠席の連絡はできますか？</summary><p>内容修正とキャンセルの期限をそれぞれ設定します。期限内なら申込確認ページから変更・欠席申請できます。幹事画面で設定と操作を試せます。</p></details><details><summary>スマートフォンやLINEから見られますか？</summary><p>はい。URLを開くだけで見られるサンプルです。操作内容は端末・ブラウザーごとに保存されます。LINE内ブラウザーとSafariなどを切り替えると、データは別になります。</p></details></div></section>`);}
function albumCards(photos){return photos.map(p=>`<a class="album-card" href="#/photo/${p.id}"><img src="${esc(p.src)}" alt="${esc(p.title)}"><div class="album-title"><span>${esc(p.title)}</span><span>↗</span></div><small>${esc(p.album)} · ${p.sample?'イラスト見本':'この端末だけの追加画像'}</small></a>`).join('');}
function classes(cl){cl=Number(cl)||0;const c=R.counts(state);let ps=state.people.filter(p=>R.active(p)&&p.public&&(!cl||p.class===cl));ps.sort((a,b)=>a.class-b.class||a.kana.localeCompare(b.kana,'ja'));return frame(title('CLASSMATES',cl?'3年'+cl+'組の、懐かしい顔ぶれ。':'みんなの参加予定','名前は架空のサンプルです。掲載を選んだ方の表示名と、入力がある場合は旧姓を表示します。')+`<div class="panel"><div class="section-head"><div><h2>${cl?'3年'+cl+'組':'全クラス'}の参加予定 <span class="amount">${cl?c.classes[cl-1]:c.total}</span> 人</h2><p>全体の参加予定：${c.total}人（架空）</p></div><a href="#/register" class="btn btn-small">自分も参加申込を試す ↗</a></div><div class="class-tabs"><a href="#/classes/0" data-roster-class class="${!cl?'active':''}">全クラス</a>${c.classes.map((n,i)=>`<a href="#/classes/${i+1}" data-roster-class class="${cl===i+1?'active':''}">3年${i+1}組 <small>${n}人</small></a>`).join('')}</div><h3 id="class-roster-heading" tabindex="-1">${cl?'3年'+cl+'組':'全クラス'}の参加予定者</h3><div class="roster">${ps.map(p=>'<div class="name-card"><small>'+esc(R.classLabel(p.class))+'</small><strong>'+esc(p.display)+'</strong>'+(String(p.oldname??'').trim()?'<small class="roster-old-name">旧姓：'+esc(p.oldname.trim())+'</small>':'')+'<div class="name-roles">'+(window.Community?.rosterLabels(state,p)||[]).map(label=>'<small class="name-role">'+esc(label)+'</small>').join('')+'</div></div>').join('')||'<p class="empty">掲載中の参加予定者はいません。</p>'}</div><p class="section-note">人数には名前を掲載していない方も含みます。欠席変更申請中・取消済みの方は参加予定人数から除外しています。</p></div>`);}
function personForm(p={}){return `<div class="grid-2">${classChoice(p.class)}${field('name','氏名',p.name||'')}${field('kana','ふりがな（カタカナ）',p.kana||'')}${field('oldname','卒業時の姓・旧姓',p.oldname||'','text',false,'名簿に名前を掲載する場合は、入力した旧姓も表示されます。')}${field('email','メールアドレス',p.email||'','email',true,'@example.test の架空アドレスをご利用ください')}${field('emailConfirm','メールアドレス（確認）',p.email||'','email')}${field('postal','郵便番号（任意）',p.postal||'','text',false)}${field('address','住所（任意）',p.address||'','text',false)}${field('phone','電話番号',p.phone||'')}${field('payer','振込名義（カタカナ）',p.payer||p.kana||'','text',true,'ふりがなの内容を初期表示します。振込名義が異なる場合は編集してください。')}${field('display','名簿に表示する名前',p.display||p.name||'','text',false)}</div><label class="field">ホームの一般名簿への名前掲載<select name="public" required><option value="yes" ${p.public!==false?'selected':''}>名前を名簿に掲載する</option><option value="no" ${p.public===false?'selected':''}>名前を掲載しない（人数には含む）</option></select></label><label class="field">幹事へのメモ <small>任意・一般名簿には表示しません</small><textarea name="note" maxlength="1000">${esc(p.note||'')}</textarea></label><label class="field"><input type="checkbox" name="sampleOnly" required>架空の情報で操作するサンプルであることを確認しました。</label>`;}
function registerPage(){let p=draft||{};if(editId)p=state.people.find(p=>p.id===editId)||p;return frame(title('REGISTRATION',editId?'参加申込の内容を変更する。':'また会う約束を、ここから。','個人で1名ずつ申し込む流れをお試しいただけます。')+notice+`<div class="panel"><div class="stepper"><span class="current">01 入力</span><span>02 確認</span><span>03 完了</span></div><button class="btn btn-outline btn-small" id="fillDemo" type="button">架空のサンプル情報を自動入力</button><form id="registrationForm">${personForm(p)}<p id="formError" class="error-text" role="alert"></p><button class="btn" type="submit">入力内容を確認する →</button></form>${applicationSchedule(state.settings)}</div>`,'narrow');}
function draftFrom(f){const d=Object.fromEntries(new FormData(f));if(d.email!==d.emailConfirm)throw new Error('メールアドレスが一致していません。');if(!['yes','no'].includes(d.public))throw new Error('名簿掲載の可否を選択してください。');if(!/^(?:[0-9]|10)$/.test(String(d.class)))throw new Error('クラスを選択するか「クラスを忘れた」を選んでください。');return {class:Number(d.class),name:d.name.trim(),kana:FormAssist.kanaName(d.kana),oldname:d.oldname.trim(),email:d.email.trim(),postal:d.postal.trim(),address:d.address.trim(),phone:d.phone.trim(),payer:R.normalizePayer(d.payer),display:d.display.trim()||d.name.trim(),public:d.public==='yes',note:d.note};}
function confirmPage(){if(!draft)return frame(title('REGISTRATION','入力内容がありません。')+'<a class="btn" href="#/register">入力へ戻る</a>','narrow');const d=draft;return frame(title('CONFIRM','この内容で、よろしいですか。')+notice+`<div class="panel"><div class="stepper"><span>01 入力</span><span class="current">02 確認</span><span>03 完了</span></div>${details([['クラス',R.classLabel(d.class)],['氏名',d.name],['ふりがな',d.kana],['メール',d.email],['住所',d.postal+' '+d.address],['電話番号',d.phone],['申告名義',d.payer],['名前の掲載',d.public?d.display+'（この名前だけを名簿へ）':'掲載しない・人数にのみ含める'],['仮会費',yen(editId?state.people.find(p=>p.id===editId).amount:state.settings.fee)]])}<div class="button-row"><button id="confirmRegistration" class="btn">${editId?'変更を保存する':'サンプル申込を確定する'} →</button><a class="btn btn-outline" href="#/register${editId?'/'+editId:''}">入力に戻る</a></div></div>`,'narrow');}
function details(rows){return '<dl class="details-grid">'+rows.map(([a,b])=>'<dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd>').join('')+'</dl>';}
function completePage(id){const p=state.people.find(p=>p.id===Number(id));if(!p)return myPage();return frame(title('THANK YOU','また会える日を、楽しみに。')+`<div class="panel"><div class="success-mark">✓</div><h2>サンプル${editId?'変更':'申込'}を保存しました。</h2><p>申込番号 <strong>${esc(p.number)}</strong></p><p>${esc(p.name)} さん ／ ${esc(R.classLabel(p.class))}</p><div class="notice">これは実際の同窓会への申込ではありません。メール送信・振込はありません。操作内容はこの端末のブラウザー内だけに保存されています。</div><div class="button-row"><a class="btn" href="#/my">自分の申込を確認 →</a><a class="btn btn-outline" href="#/classes/${p.class}">クラスの名簿を見る</a></div></div>`,'narrow');}
function myPage(){const p=state.people.find(p=>p.id===selectedPerson)||state.people[0],paid=R.totalPaid(state,p.id)-R.totalRefunded(state,p.id),d=R.due(state,p);selectedPerson=p.id;const g=R.registrationGuide(p,paid,d,state.settings.clock,state.settings.payment);return frame(title('MY REGISTRATION','自分の申込を確認する。','本番は本人認証が必要です。今回のサンプルでは架空の申込を切り替えて体験できます。')+notice+`<div class="panel">${select('demoPerson','確認する架空の申込',state.people.map(p=>[p.id,p.number+' / '+p.name]),p.id)}<div class="section-head"><div><h2 id="my-person-heading">${esc(p.name)} さん</h2><p>${esc(p.number)} ／ ${esc(R.classLabel(p.class))} ${pill(p.status)}</p></div></div><section class="registration-guide guide-${esc(g.tone)}" aria-label="申込状況と次のお手続き"><p class="guide-status">${esc(g.label)}</p><h2>${esc(g.title)}</h2><p>${esc(g.message)}</p><p class="guide-note">${esc(g.note)}</p></section><div class="stats-grid"><div class="stat"><small>参加費</small><strong>${yen(['cancelled','rejoin_requested'].includes(p.status)?0:p.amount)}</strong></div><div class="stat"><small>${R.totalRefunded(state,p.id)>0?'返金差引後の入金額':'確認済みの入金額'}</small><strong>${yen(paid)}</strong></div><div class="stat"><small>${esc(g.balanceLabel)}</small><strong>${esc(g.balanceValue)}</strong></div><div class="stat"><small>名前の掲載</small><strong style="font-size:19px">${p.public?'掲載する':'掲載しない'}</strong></div></div>${details([['氏名',p.name],['メール',p.email],['住所',p.address],['電話',p.phone]])}${R.active(p)?`<div class="button-row"><button class="btn" data-action="edit-person" data-id="${p.id}" ${state.settings.clock>state.settings.change?'disabled':''}>申込内容を変更</button><button class="btn btn-outline" data-action="cancel-person" data-id="${p.id}" ${state.settings.clock>state.settings.cancel?'disabled':''}>欠席に変更する</button></div>`:'<p class="muted">欠席の申請・取消状況は幹事が確認します。</p>'}</div><div class="panel"><h3>この申込の操作履歴</h3>${history(state.logs.filter(l=>l.entity===p.number))}</div>`);}
function history(logs){return logs.length?'<div class="history">'+logs.slice().reverse().map(l=>'<div class="history-item"><small>'+esc(date(l.at))+' ／ '+esc(l.actor)+'</small><p><strong>'+esc(l.action)+'</strong> '+pill(l.result,l.result!=='成功')+'</p><p>'+esc(l.reason)+'</p></div>').join('')+'</div>':'<p class="muted">この申込の追加操作はまだありません。</p>';}

function bankPage(){return adminShell('bank',`<div class="panel"><h3>銀行CSVを取り込む</h3><p class="muted">架空のUFJ形式CSVで取込・候補確認・入金割当を試せます。振込名義の列は未確定として扱います。</p><div class="button-row"><button class="btn btn-outline btn-small" data-action="fixture-download" data-id="1">前半CSVを取得 ↓</button><button class="btn btn-outline btn-small" data-action="fixture-download" data-id="2">期間重複CSVを取得 ↓</button><button class="btn btn-outline btn-small" data-action="fixture-download" data-id="3">要確認CSVを取得 ↓</button></div><label class="file-drop">架空CSVを選択 <input type="file" id="bankFile" accept=".csv"></label><div class="button-row"><button class="btn" data-action="import-fixture" data-id="1">前半の架空CSVで試す</button><button class="btn btn-outline" data-action="import-fixture" data-id="2">重複期間のCSVで試す</button><button class="btn btn-outline" data-action="import-fixture" data-id="3">要確認CSVで試す</button></div><p class="mini-note">ボタンならファイル選択不要。何度でも同一ファイル再取込・重複期間を確認できます。実銀行明細は使用しないでください。</p></div><div class="panel"><h3>取込結果</h3>${state.imports.length?state.imports.slice().reverse().map(i=>`<details><summary>取込 #${i.id} ${esc(i.filename)} · ${i.count}明細 / 重複候補${i.duplicates} / エラー${i.errors.length}</summary><p class="mini-note">${esc(date(i.at))} ／ ${esc(i.actor)} ／ 管理情報${i.managementRows}行と見出しを区別</p>${table(['行','明細ID','内容'],i.rows.map(r=>[r.line,'#'+r.transactionId,esc(r.raw.join(' / '))]).concat(i.errors.map(r=>[r.line,'エラー',esc(r.error)+' / '+esc(r.raw.join(' / '))])))}<details><summary>元のCSVを見る（このブラウザー内）</summary><pre>${esc(i.source)}</pre></details></details>`).join(''):'<p class="muted">まだCSVを取り込んでいません。</p>'}</div><div class="panel"><div class="section-head"><h3>明細の照合</h3><button class="btn btn-outline btn-small" data-action="export-payments">入金一覧CSV ↓</button></div><div class="filter-row"><select class="filter" id="bankState" aria-label="銀行明細の状態"><option value="imported">今回の取込明細</option><option value="pending">確認待ち</option><option value="confirmed">確認済</option><option value="all">すべて（初期入金含む）</option></select></div><div id="bankTable"></div></div>`);}
function renderBank(){const el=document.querySelector('#bankTable');if(!el)return;const st=document.querySelector('#bankState').value;const ts=state.transactions.filter(t=>st==='all'||st==='imported'&&t.importId||t.state===st).slice().reverse();el.innerHTML=table(['明細','日付','内容','入金 / 出金','残高','未割当','状態','操作'],ts.map(t=>['#'+t.id,esc(t.date),esc(t.memo)+'<br><small>'+esc(t.review)+'</small>',yen(t.credit)+' / '+yen(t.debit),yen(t.balance),yen(t.credit-R.used(state,t.id)),pill(t.state,t.state==='pending'),'<button class="link" data-action="transaction-detail" data-id="'+t.id+'">確認・割当</button>']));}
function transactionDetail(id){const t=state.transactions.find(t=>t.id===id);let b='<div class="eyebrow">BANK RECONCILIATION</div><h2>明細 #'+id+'</h2>'+details([['日付',t.date],['摘要（参考）',t.memo],['入金額',yen(t.credit)],['出金額',yen(t.debit)],['残高',yen(t.balance)],['未割当',yen(t.credit-R.used(state,id))],['状態',label[t.state]]])+'<div class="notice">'+esc(t.review)+'</div><details><summary>元データ9列</summary><pre>'+esc(JSON.stringify(t.raw,null,2))+'</pre></details>';
 if(t.state==='pending')b+='<form id="decisionForm" data-id="'+id+'">'+select('decision','明細の判定',[['confirmed','入金を確認（重複候補は別取引として保持）'],['excluded','重複・対象外として除外']],'confirmed')+field('reason','名義・資金化・重複を確認した理由')+'<p class="error-text" id="modalError" role="alert"></p><button class="btn">判定を記録</button></form>';
 if(t.state==='confirmed'&&t.credit-R.used(state,id)>0){let candidates=state.people.filter(p=>p.status!=='cancelled').map(p=>{const reasons=[];if(t.memo.includes(p.number))reasons.push('申込番号一致');if(p.payer&&t.memo.includes(p.payer))reasons.push('申告名義を含む（参考）');if(R.due(state,p)===t.credit-R.used(state,id))reasons.push('金額一致');return {p,reasons};}).filter(c=>c.reasons.length).sort((a,b)=>b.reasons.length-a.reasons.length).slice(0,5);b+='<h3>照合候補（自動確定しません）</h3>'+table(['番号','氏名','理由'],candidates.map(({p,reasons})=>[esc(p.number),esc(p.name),esc(reasons.join(' / '))]))+'<form id="allocateForm" data-id="'+id+'">'+field('number','割当先の申込番号',candidates[0]?.p.number||'')+field('amount','割当金額',t.credit-R.used(state,id),'number')+field('reason','確認根拠・割当理由')+'<p class="error-text" id="modalError" role="alert"></p><button class="btn">入金を確定・割当</button></form>';}

 if(el.id==='bankFile'&&el.files[0]){try{const file=el.files[0];if(file.size>1500000)throw new Error('CSVは1.5MB以下でお試しください。');const bytes=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(bytes);if(!text.includes(R.HEADERS.join(','))&&!text.includes('"日付"'))text=new TextDecoder('shift_jis').decode(bytes);await importText(text,file.name);}catch(e){toast(e.message);}}
 if(el.id==='photoFiles'&&el.files.length){try{if(el.files.length>4)throw new Error('1回に4枚まで選択してください。');const images=[];for(const f of el.files){if(!['image/jpeg','image/png'].includes(f.type)||f.size>5e6)throw new Error('JPEG・PNG、1枚5MB以内で選択してください。');const uri=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f);});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('画像として読み込めません。'));img.src=uri;});if(img.width*img.height>20000000)throw new Error('画像は2000万画素以内にしてください。');const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);images.push({title:f.name.replace(/\.[^.]*$/,''),src:canvas.toDataURL('image/jpeg',.78)});}change(s=>{for(const image of images){const id=Math.max(0,...s.photos.map(p=>p.id))+1;s.photos.push({...image,id,album:'この端末のテスト画像',published:false,sample:false});R.audit(s,actor,'テスト画像を端末内に登録','photo:'+id,null,{title:image.title,published:false},'外部送信なし・公開前確認');}});route();toast(images.length+'枚を非公開で追加しました。公開ボタンでアルバムへ出せます。');}catch(e){toast(e.message);}}
 if(el.id==='restoreFile'&&el.files[0]){try{if(!owner())throw new Error('復元は管理者だけが行えます。');if(el.files[0].size>4000000)throw new Error('バックアップは4MB以内にしてください。');const obj=JSON.parse(await el.files[0].text());if(obj.schema!==1||!Array.isArray(obj.people)||!Array.isArray(obj.logs)||!Array.isArray(obj.photos)||!obj.settings||!Array.isArray(obj.allocations)||!Array.isArray(obj.transactions)||!Array.isArray(obj.imports)||!Array.isArray(obj.mail)||!Array.isArray(obj.refunds))throw new Error('このデモのバックアップ形式ではありません。');for(const p of obj.photos)if(!/^assets\/[a-z-]+\.svg$/.test(p.src)&&!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.src)&&!R.seed().photos.some(v=>v.src===p.src))throw new Error('画像データの形式が不正です。');download('同窓会_復元前バックアップ.json',JSON.stringify(state,null,2),'application/json');R.audit(obj,actor,'サンプルバックアップ復元','demo',null,{people:obj.people.length},'端末内データの復元');localStorage.setItem(KEY,JSON.stringify(obj));state=obj;route();toast('この端末のデモを復元しました');}catch(e){toast('復元できません：'+e.message);}}

</script><script>/* Fictional browser demo domain functions. Real authority lives on the PHP server. */
(function(root){'use strict';const R=root.Reunion;
const EXPENSE_CATEGORIES=['飲食会場費','当日運営費','事務決済費','恩師関連費','その他予備費'];
function prepare(s){s.expenses??=[];s.expenseLinks??=[];s.refundLinks??=[];s.otherIncome??=[];s.accountOpening??=0;s.people.forEach(p=>{p.role??=p.id===1?'owner':p.id===2?'organizer':'participant';});}
function amount(n){if(!Number.isSafeInteger(n)||n<=0||n>100000000)throw new Error('金額は1〜100,000,000円の整数で入力してください。');}
function expense(s,d,actor){prepare(s);amount(d.amount);R.parseDate(d.date);if(!EXPENSE_CATEGORIES.includes(d.category))throw new Error('費目を選択してください。');if(!d.payee?.trim()||!d.purpose?.trim()||!d.reason?.trim())throw new Error('支払先・用途・理由が必要です。');const e={...R.clone(d),id:Math.max(0,...s.expenses.map(x=>x.id))+1,status:'submitted',created:new Date().toISOString(),actor};s.expenses.push(e);R.audit(s,actor,'経費申請','expense:'+e.id,null,{...e,receipt:e.receipt?'添付あり':null},d.reason);return e;}
function migrateLegacyCategories(s,actor='システム（費目統合）'){prepare(s);let count=0;for(const e of s.expenses)if(e.category==='システム運営費'){const before={category:e.category};e.category='事務決済費';R.audit(s,actor,'経費費目を統合','expense:'+e.id,before,{category:e.category},'旧「システム運営費」を「事務決済費」へ移行');count++;}return count;}
function approve(s,id,actor,reason){prepare(s);const e=s.expenses.find(x=>x.id===id);if(!e||e.status!=='submitted'||!reason.trim())throw new Error('確認待ちの経費と承認理由が必要です。');if(e.actor===actor)throw new Error('自分の経費は別の幹事に承認を依頼してください。');e.status='approved';R.audit(s,actor,'経費承認','expense:'+id,{status:'submitted'},{status:'approved'},reason);}
function paid(s,eid){return (s.expenseLinks||[]).filter(x=>x.expenseId===eid&&x.active).reduce((a,x)=>a+x.amount,0);}
function debitUsed(s,tid){return (s.expenseLinks||[]).filter(x=>x.transactionId===tid&&x.active).reduce((a,x)=>a+x.amount,0)+(s.refundLinks||[]).filter(x=>x.transactionId===tid&&x.active).reduce((a,x)=>a+x.amount,0);}
function outgoing(s,tid,actor,reason){const t=s.transactions.find(x=>x.id===tid);if(!t||t.state!=='pending'||!t.debit||!reason.trim())throw new Error('確認待ちの出金明細と理由が必要です。');t.state='confirmed';R.audit(s,actor,'出金明細確認','transaction:'+tid,{state:'pending'},{state:t.state,debit:t.debit},reason);}
function link(s,tid,eid,n,actor,reason){prepare(s);amount(n);const t=s.transactions.find(x=>x.id===tid),e=s.expenses.find(x=>x.id===eid);if(!t||t.state!=='confirmed'||!t.debit||!e||e.status!=='approved'||!reason.trim())throw new Error('確認済み出金・承認済み経費・理由が必要です。');if(n>t.debit-debitUsed(s,tid)||n>e.amount-paid(s,eid))throw new Error('出金または経費の未照合額を超えています。');const a={id:Math.max(0,...s.expenseLinks.map(x=>x.id))+1,transactionId:tid,expenseId:eid,amount:n,active:true,actor};s.expenseLinks.push(a);R.audit(s,actor,'経費と出金の照合','expense:'+eid,null,a,reason);}
function reverse(s,id,actor,reason){const x=(s.expenseLinks||[]).find(x=>x.id===id);if(!x||!x.active||!reason.trim())throw new Error('有効な照合と取消理由が必要です。');x.active=false;x.cancelReason=reason;R.audit(s,actor,'経費出金照合取消','expense:'+x.expenseId,{active:true},{...x},reason);}

(function(root){'use strict';const R=root.Reunion;
function prepare(s){s.refunds??=[];s.refundLinks??=[];for(const x of s.refunds){if(x.status==='予定')x.status='planned';if(x.status==='模擬完了')x.status='recorded';x.refundDate??=(x.at||'').slice(0,10);x.reference??='';}return s;}
function staff(s,uid){const u=s.people.find(p=>p.id===Number(uid));if(!u||!['owner','organizer'].includes(u.role))throw new Error('幹事のログインが必要です。');return u;}
function person(s,id){const p=s.people.find(p=>p.id===Number(id));if(!p)throw new Error('申込がありません。');return p;}
function why(v){v=String(v||'').trim();if(!v||v.length>1000)throw new Error('処理理由を1〜1000文字で入力してください。');return v;}
function positive(n){if(!Number.isSafeInteger(n)||n<1||n>100000000)throw new Error('金額は1〜100,000,000円の整数です。');}
function billed(p){return ['cancelled','rejoin_requested'].includes(p.status)?0:p.amount;}
function refunded(s,id){prepare(s);return s.refunds.filter(x=>x.personId===Number(id)&&x.status==='recorded').reduce((n,x)=>n+x.amount,0);}
function planned(s,id){prepare(s);return s.refunds.filter(x=>x.personId===Number(id)&&x.status==='planned').reduce((n,x)=>n+x.amount,0);}
function netPaid(s,id){return R.totalPaid(s,Number(id))-refunded(s,id);}
function available(s,id){const p=person(s,id);return Math.max(0,netPaid(s,id)-billed(p)-planned(s,id));}
function room(s){if(s.people.filter(R.active).length>=s.settings.capacity)throw new Error('参加定員に達しています。幹事へご相談ください。');}
function own(s,id,uid,revision){const p=person(s,id);if(p.id!==Number(uid))throw new Error('本人の申込だけ操作できます。');if(p.revision!==Number(revision))throw new Error('内容が更新されています。画面を読み直してください。');return p;}
function status(s,p,next,uid,action,reason){const before={status:p.status,revision:p.revision};p.status=next;p.revision=(p.revision||0)+1;R.audit(s,person(s,uid).name,action,p.number,before,{status:next,revision:p.revision},reason);return p;}
function withdraw(s,id,revision,reason,uid){reason=why(reason);R.checkDeadline(s,'change');const p=own(s,id,uid,revision);if(p.status!=='cancel_requested')throw new Error('欠席申請中の申込ではありません。');room(s);return status(s,p,'active',uid,'欠席申請の取り消し',reason);}

function refund(s,id){prepare(s);const x=s.refunds.find(x=>x.id===Number(id));if(!x)throw new Error('返金記録がありません。');return x;}
function refundPaid(s,id){prepare(s);return s.refundLinks.filter(x=>x.refundId===Number(id)&&x.active).reduce((n,x)=>n+x.amount,0);}

function cancelRefund(s,id,reason,uid){staff(s,uid);reason=why(reason);const x=refund(s,id);if(x.status!=='planned')throw new Error('未送金の返金予定だけ取り消せます。');const before=R.clone(x);x.status='cancelled';R.audit(s,person(s,uid).name,'返金予定の取り消し',person(s,x.personId).number,before,x,reason);}

function debitUsed(s,id){prepare(s);return (s.expenseLinks||[]).filter(x=>x.active&&x.transactionId===Number(id)).reduce((n,x)=>n+x.amount,0)+s.refundLinks.filter(x=>x.active&&x.transactionId===Number(id)).reduce((n,x)=>n+x.amount,0);}
function linkRefund(s,id,tid,n,reason,uid){staff(s,uid);reason=why(reason);positive(n);const x=refund(s,id),t=s.transactions.find(t=>t.id===Number(tid));if(x.status!=='recorded'||!t||t.state!=='confirmed'||!t.debit)throw new Error('返金記録済みの予定と確認済み銀行出金を選んでください。');if(n>x.amount-refundPaid(s,id)||n>t.debit-debitUsed(s,tid))throw new Error('返金または出金の未照合額を超えています。');const a={id:Math.max(0,...s.refundLinks.map(a=>a.id))+1,refundId:x.id,transactionId:t.id,amount:n,active:true,reason,actorId:Number(uid)};s.refundLinks.push(a);R.audit(s,person(s,uid).name,'返金と銀行出金の照合',person(s,x.personId).number,null,a,reason);return a;}
function unlinkRefund(s,id,reason,uid){prepare(s);staff(s,uid);reason=why(reason);const a=s.refundLinks.find(a=>a.id===Number(id));if(!a||!a.active)throw new Error('有効な返金照合ではありません。');a.active=false;R.audit(s,person(s,uid).name,'返金出金照合の取り消し',person(s,refund(s,a.refundId).personId).number,{active:true},a,reason);}

 s.sampleRosterVarietyVersion=1;R.audit(s,'システム（サンプル）','クラス別の人数と幹事見本を更新','demo',null,{added,counts:DEMO_CLASS_COUNTS,ordinaryOrganizers:assigned},'架空データのみ追加。既存の申込・入金・投稿・手動のクラス幹事指定は保持');}
function addSampleOldNames(s){
  if(s.sampleOldNamesAdded)return;
  const examples={3:'鈴木',20:'加藤',38:'近藤',70:'伊藤',103:'小林'};

function prepare(s){refreshDemoRoster(s);addSampleOldNames(s);s.settings.classSize??=47;if(s.settings.dateLabel==='2028年○月○日（未定）')s.settings.dateLabel='2028年10月31日（火）（仮）';s.inquiries??=[];s.albums??=R.clone(ALBUMS);s.albums.forEach(a=>a.downloadAllowed??=false);if(!s.albumTemplateVersion){const oldNames=['当日の様子','集合写真','懇親会'],oldDescriptions=['再会のひとときを、写真で。','懐かしい顔が、勢ぞろい。','話の続きは、同じテーブルで。'];const defaults=s.albums.length===3&&s.albums.every((a,i)=>a.id===i+1&&a.name===oldNames[i]&&a.description===oldDescriptions[i]&&a.position===i+1&&a.visible===true)&&!s.logs.some(l=>l.action==='アルバム設定');if(defaults){const before=R.clone(s.albums);s.albums=R.clone(ALBUMS);s.photos.forEach(p=>p.albumId=1);R.audit(s,'システム（サンプル）','見本アルバムの整理','albums',before,s.albums,'固定の3分類から自由設定へ。写真は保持。');}s.albumTemplateVersion=1;}if(!s.classContacts){s.classContacts=[];for(let cl=1;cl<=10;cl++)s.people.filter(p=>p.class===cl&&R.active(p)).slice(0,2).forEach((p,j)=>s.classContacts.push({id:s.classContacts.length+1,userId:p.id,class:cl,position:j+1}));}s.photos.forEach((p,i)=>{p.albumId??=1;p.album=s.albums.find(a=>a.id===p.albumId)?.name||'アルバム未設定';});diversifyDemoRoster(s);}
function admin(s,uid,onlyOwner=false){const p=s.people.find(p=>p.id===uid);if(!p||!['owner','organizer'].includes(p.role)||onlyOwner&&p.role!=='owner')throw new Error(onlyOwner?'管理者だけが設定できます。':'幹事のログインが必要です。');return p;}
function required(v,max=10000){v=String(v??'').trim();if(!v||v.length>max)throw new Error('必須項目を入力し、長すぎる内容を短くしてください。');return v;}
function inquiry(s,d,uid=null){prepare(s);if(!/^(?:[0-9]|10)$/.test(String(d.class??'')))throw new Error('クラスを選択してください。');const email=required(d.email,254).toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('返信用メールアドレスを確認してください。');const x={id:Math.max(0,...s.inquiries.map(i=>i.id))+1,userId:uid,class:Number(d.class),name:required(d.name,200),email,subject:required(d.subject,200),body:required(d.body),status:'new',assignee:null,replies:[],created:new Date().toISOString()};s.inquiries.push(x);R.audit(s,uid?'申込者（サンプル）':'未ログイン（サンプル）','問い合わせ受付','inquiry:'+x.id,null,{status:x.status},'架空の公開フォーム');return x;}

function status(s,id,st,assignee,reason,uid){const a=admin(s,uid),i=s.inquiries.find(i=>i.id===id);if(!i||!['new','in_progress','closed'].includes(st))throw new Error('問い合わせと対応状況を確認してください。');if(assignee)admin(s,assignee);const before={status:i.status,assignee:i.assignee};i.status=st;i.assignee=assignee||null;R.audit(s,a.name,'問い合わせ対応状況変更','inquiry:'+id,before,{status:st,assignee:i.assignee},required(reason));}

  function historyList() {

    return '<ul>'+ rows.slice(0,30).map(l=>{
      const p = state.people.find(p=>p.id===Number(l.entity.split(':')[1]));
      return `<li>${esc(p?.number)} ${esc(p?.name)} ／ ${esc(l.action)} ／ ${esc(l.after?.at ? stamp(l.after.at) : date(l.at))} ／ ${esc(l.reason)} ／ ${esc(l.actor)}</li>`;

  }

    const v = windowFor(state);

      <p>日時は日本時間です。見本の日時は当日受付の操作確認に使います。参加予定の名簿に受付状況が出るのは、実際の開催日にログインしたときです。</p>
      <form id="checkin-settings-form">
      ${field('start','受付開始',v.start,'datetime-local')}
      ${field('end','受付終了',v.end,'datetime-local')}

      <fieldset><legend>受付を許可する管理担当</legend>
      ${staff.map(p=>`<p><label><input type="checkbox" name="staff" value="${p.id}" ${read(state).staff.includes(p.id)?'checked':''}> ${esc(p.name)}（${esc(p.number)}）</label></p>`).join('') || '<p>管理担当はまだいません。</p>'}

      </form></section>`);
  }

  route = function () {

    baseRoute();

      if (path==='/admin/checkin') main.innerHTML = allowed() ? desk() : frame(title('ACCESS','受付権限が必要です。'));

    if (path!=='/admin/checkin' || !allowed()) { selected = null; search = ''; }
    rosterTotals(path);
  };

  function message(value) {
    const box = document.querySelector('#checkin-message');
    if (box) box.textContent = value;
  }

    selected = {id,method};

    target.innerHTML = personCard();
    const card = target.firstElementChild;
    if (card) {
      card.scrollIntoView({block:'start'});
      card.focus({preventScroll:true});
    }
  }

    if (!width || !height) return null;
    const canvas = document.createElement('canvas');
    const scale = Math.min(1,1280/Math.max(width,height));
